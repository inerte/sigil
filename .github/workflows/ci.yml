name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: required quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Install system Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev pkg-config

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            language/compiler/target
          key: ${{ runner.os }}-cargo-quality-system-z3-${{ hashFiles('Cargo.lock', 'language/compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-system-z3-

      - name: Enable corepack pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required quality gate
        run: pnpm sigil:quality
